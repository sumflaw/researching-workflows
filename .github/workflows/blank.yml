name: Translate Qt .ts files

on:
  workflow_dispatch:
    inputs:
      target_language:
        description: 'Only this language (e.g. fr, de, pt_BR). Empty = every language found in the .ts files'
        required: false
        default: ''
      model_name:
        description: 'Hugging Face model for translation'
        required: false
        default: 'facebook/nllb-200-distilled-600M'
      mark_finished:
        description: 'Mark machine translations as finished (default: leave as unfinished for review)'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: translate-ts
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: /tmp/hf_cache
      # inputs.* is empty on scheduled runs, so every value needs a fallback
      MODEL_NAME: ${{ inputs.model_name || 'facebook/nllb-200-distilled-600M' }}
      TARGET_LANG: ${{ inputs.target_language || '' }}
      MARK_FINISHED: ${{ inputs.mark_finished == true && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: /tmp/hf_cache
          key: hf-${{ env.MODEL_NAME }}

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers sentencepiece lxml

      - name: Translate
        id: translate
        run: python .github/scripts/translate_ts.py

      - name: Open pull request with translations
        if: steps.translate.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: '**/*.ts'
          branch: i18n/auto-translate
          delete-branch: true
          commit-message: 'chore(i18n): machine-translate .ts files'
          title: 'chore(i18n): machine-translated strings'
          body: |
            Automated NLLB translations (`${{ env.MODEL_NAME }}`).
            Strings are left `unfinished` unless `mark_finished` was set, so they show up for review in Qt Linguist.
