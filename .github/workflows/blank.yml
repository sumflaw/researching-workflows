name: "GitHub Pages Spam & Phishing Hunter"

on:
  workflow_dispatch: # Allows you to trigger it manually
  schedule:
    - cron: '0 */12 * * *' # Runs automatically every 12 hours

permissions:
  contents: read

jobs:
  scan-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run SEO Hunter Script
        run: |
          cat > seo_hunter.py << 'PYEOF'
          import asyncio
          import aiohttp
          import json
          import re
          import random

          # Blacklisted keywords commonly found in SEO spam
          SPAM_KEYWORDS = [
              "viagra", "cialis", "casino", "poker", "slots", "replica watches", 
              "cheap pills", "pharmacy", "crypto pump", "loan", "escort", 
              "porn", "adult dating", "betting", "gambling", "1xbet"
          ]

          # Phishing indicators (regex)
          PHISHING_PATTERNS = [
              r"(?i)steamcommunity\.com.*login",
              r"(?i)netflix.*account.*update",
              r"(?i)metamask.*wallet.*restore",
              r"(?i)paypal.*verification",
              r"(?i)roblox.*robux.*generator"
          ]

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          async def fetch_recent_github_pages(limit=200):
              """Fetches recently registered .github.io domains via crt.sh"""
              print(f"[*] Querying Certificate Transparency logs for recent .github.io domains...")
              url = "https://crt.sh/?q=%25.github.io&output=json"
              
              try:
                  async with aiohttp.ClientSession() as session:
                      async with session.get(url, timeout=60) as response:
                          if response.status != 200:
                              print(f"[!] Failed to fetch from crt.sh. Status: {response.status}")
                              return []
                          
                          data = await response.json()
                          
                          domains = set()
                          for entry in data:
                              name = entry.get("name_value", "").lower()
                              for domain in name.split("\n"):
                                  if domain.endswith(".github.io") and "*" not in domain:
                                      domains.add(domain.strip())
                          
                          # Sort by newest (crt.sh usually returns newest first)
                          domain_list = list(domains)[:limit]
                          print(f"[+] Found {len(domain_list)} unique domains to scan.")
                          return domain_list
                          
              except Exception as e:
                  print(f"[!] Error fetching domains: {e}")
                  return []

          async def scan_domain(session, domain):
              """Visits the domain and scans for spam/phishing indicators"""
              url = f"https://{domain}"
              result = {
                  "domain": domain,
                  "status": "clean",
                  "indicators": [],
                  "title": ""
              }

              # Small random delay to avoid aggressive rate limiting
              await asyncio.sleep(random.uniform(0.1, 0.5))

              try:
                  async with session.get(url, headers=HEADERS, timeout=10, allow_redirects=True) as response:
                      if response.status != 200:
                          return None # Skip dead pages or 404s
                      
                      html = await response.text()
                      
                      # Extract title
                      title_match = re.search(r"<title>(.*?)</title>", html, re.IGNORECASE | re.DOTALL)
                      if title_match:
                          result["title"] = title_match.group(1).strip()[:100]

                      # 1. Check for SEO Spam Keywords
                      html_lower = html.lower()
                      for keyword in SPAM_KEYWORDS:
                          if keyword in html_lower:
                              result["status"] = "spam"
                              result["indicators"].append(f"Keyword: {keyword}")

                      # 2. Check for Phishing Patterns
                      for pattern in PHISHING_PATTERNS:
                          if re.search(pattern, html):
                              result["status"] = "phishing"
                              result["indicators"].append(f"Phishing pattern: {pattern}")

              except (aiohttp.ClientError, asyncio.TimeoutError):
                  pass # Ignore timeouts
              except Exception:
                  pass

              if result["status"] != "clean":
                  return result
              return None

          async def main():
              domains = await fetch_recent_github_pages(limit=300)
              
              if not domains:
                  print("No domains found.")
                  return

              print(f"[*] Scanning {len(domains)} domains for spam and phishing...")
              
              flagged = []
              # Use a connector limit to avoid overwhelming your network
              connector = aiohttp.TCPConnector(limit=25)
              async with aiohttp.ClientSession(connector=connector) as session:
                  tasks = [scan_domain(session, domain) for domain in domains]
                  results = await asyncio.gather(*tasks)
                  
                  for res in results:
                      if res:
                          flagged.append(res)
                          print(f"[🚨 FLAGGED] {res['domain']} -> {res['status'].upper()}")
                          print(f"    Title: {res['title']}")
                          print(f"    Indicators: {', '.join(res['indicators'])}")

              # Save results to JSON
              with open("flagged_github_pages.json", "w") as f:
                  json.dump(flagged, f, indent=4)

              print(f"\n[+] Scan complete. Flagged {len(flagged)} malicious domains out of {len(domains)} scanned.")

          if __name__ == "__main__":
              asyncio.run(main())
          PYEOF
          
          python seo_hunter.py

      - name: Upload Evidence Artifact
        if: always() # Upload even if the script throws an error or finds nothing
        uses: actions/upload-artifact@v4
        with:
          name: flagged-pages-report
          path: flagged_github_pages.json
          retention-days: 7
